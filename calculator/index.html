<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body {
            text-align: center;
            background: #cac9c9;
        }
        input {
            width: 100px;
            padding: 10px;
            margin: 5px;
        }
        button {
            width: 50px;
            padding: 10px;
            margin: 5px;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Simple Calculator</h2>

    <input type="number" id="num1" placeholder="Num 1">
    <input type="number" id="num2" placeholder="Num 2"><br>

    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">-</button>
    <button onclick="calculate('*')">*</button>
    <button onclick="calculate('/')">/</button>

    <div id="result"></div>

    <script>
        function calculate(op) {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            let res;

            if (op === '+') res = n1 + n2;
            else if (op === '-') res = n1 - n2;
            else if (op === '*') res = n1 * n2;
            else if (op === '/') res = n1 / n2;

            document.getElementById('result').textContent = "Result: " + res;
        }
    </script>
</body>
</html>
