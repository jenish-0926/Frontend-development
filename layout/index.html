<!DOCTYPE html>
<html>
<head>
<title>Single Page Layout</title>

<style>
body{
    margin:0;
    font-family:Arial;
}

/* Navbar */
nav{
    background:#333;
    color:white;
    padding:15px;
    text-align:center;
}

/* Hero Section */
.hero{
    background:#4CAF50;
    color:white;
    padding:60px 20px;
    text-align:center;
}

/* Sections */
section{
    padding:40px 20px;
    text-align:center;
}

/* Cards */
.cards{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.card{
    width:200px;
    background:#f2f2f2;
    padding:15px;
    border-radius:10px;
}

/* Footer */
footer{
    background:#333;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>

<body>

<!-- Navbar -->
<nav>
    My Single Page Website
</nav>

<!-- Hero -->
<div class="hero">
    <h1>Welcome</h1>
    <p>Simple HTML single page layout</p>
</div>

<!-- About -->
<section>
    <h2>About</h2>
    <p>This is a simple single page website using HTML and CSS.</p>
</section>

<!-- Cards Section -->
<section>
    <h2>Services</h2>

    <div class="cards">

        <div class="card">
            <h3>HTML</h3>
            <p>Structure</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Design</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Functionality</p>
        </div>

    </div>
</section>

<!-- Contact -->
<section>
    <h2>Contact</h2>
    <p>Email: example@gmail.com</p>
</section>

<!-- Footer -->
<footer>
    © 2026 My Website
</footer>

</body>
</html>
